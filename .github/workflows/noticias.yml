name: Notícias (de hora em hora)
on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publicar-dados
  cancel-in-progress: false
jobs:
  noticias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Buscar notícias
        run: python3 scripts/noticias.py
      - name: Publicar
        run: |
          git config user.name "monitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/noticias.json
          git diff --cached --quiet && exit 0
          git commit -m "Notícias: atualização automática"
          git pull --rebase origin main && git push origin HEAD:main
